name: Validación INGEMAT v2
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  academic-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/omr/requirements.txt
      - run: node scripts/check-install.cjs --lock-only
      - run: npm ci
      - run: npm run install:doctor
      - run: npm run whatsapp:doctor
      - run: python -m pip install -r src/omr/requirements.txt
      - run: npm run omr:doctor
      - run: npm run check
      - run: npm test
      - run: npm run test:omr
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm audit --omit=dev --audit-level=high
  windows-install:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        npm: ['11.9.0', '11.16.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm install --global npm@${{ matrix.npm }}
      - run: node scripts/check-install.cjs --lock-only
      # Impide que las herramientas del runner oculten una compilación accidental.
      - run: npm ci --foreground-scripts
        env:
          NODE_GYP_FORCE_PYTHON: C:/ingemat-no-build-toolchain/python.exe
      - run: npm run install:doctor
      - run: npm run whatsapp:doctor
