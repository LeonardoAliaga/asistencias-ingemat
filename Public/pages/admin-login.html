<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Acceso Admin</title>
    <link rel="stylesheet" href="../css/admin.css" />
    <link rel="stylesheet" href="../css/admin-forms.css" />
    <link
      rel="stylesheet"
      href="/vendor/bootstrap-icons/bootstrap-icons.css"
    />
    <script src="/vendor/purify.min.js"></script>
    <script src="/js/session.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" /><link rel="stylesheet" href="/css/v2.css" /></head>
  <body>
    <div class="container-login">
      <img src="../img/Logo 1x4 b&w.svg" alt="Logo ingemat" />
      <h2>Acceso al panel de administración</h2>
      <form id="login-form">
        <label for="username">Usuario</label><input type="text" id="username" value="admin" autocomplete="username" required />
        <label for="password">Contraseña</label><input
          autocomplete="current-password"
          type="password"
          id="password"
          placeholder="Contraseña"
          required
        />
        <button type="submit">Entrar</button>
      </form>
      <div id="msg"></div>
    </div>
    <script>
      document.getElementById("login-form").onsubmit = async function (e) {
        e.preventDefault();
        const pass = document.getElementById("password").value;
        const res = await fetch("/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: document.getElementById("username").value, password: pass }),
        });
        const data = await res.json();
        if (data.exito) {
          window.location.href = "/admin";
        } else {
          document.getElementById("msg").textContent = data.mensaje;
        }
      };
    </script>
  </body>
</html>
